          <a href="assets/resume.pdf" download="Akash_B_L_Resume.pdf" class="btn btn-primary" id="btn-download-resume">

            Print Resume
          </button>

        <!-- Embedded Frame -->
        <div class="resume-preview-container" id="resume-container">
          <iframe src="assets/resume.pdf" class="resume-iframe" title="Akash B L Resume Preview">
            <div class="resume-fallback">
              <p>Your browser does not support embedding PDF files. You can view or print the resume by downloading it.</p>
              <a href="assets/resume.pdf" download="Akash_B_L_Resume.pdf" class="btn btn-primary">Download Resume PDF</a>
            </div>
          </iframe>
        </div>

      </div>
    </section>
